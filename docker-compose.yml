version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: immotrend-db
    environment:
      POSTGRES_DB: immotrend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: immotrend2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: immotrend-api
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_NAME=immotrend
      - DB_USER=postgres
      - DB_PASSWORD=immotrend2024
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./site/immotrend
    container_name: immotrend-front
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./site/immotrend:/app
      - /app/node_modules

volumes:
  postgres_data:
